# Nexus scholarship scraper — scheduled + on-demand.
#
# Runs broad Brave discovery into admin-only staging and refreshes selected
# scholarships. Publication requires an admin's Add to Nexus. Manual records
# (is_manual = true) are never overwritten — that protection lives in the
# database function scraper_upsert_scholarship(), not here.
#
# TRIGGERS
#   portfolio copy     manual runs only; configure your own backend and secrets
#   workflow_dispatch  from the Admin area, via the trigger-crawl Edge Function,
#                      or manually from the Actions tab
#
# SECRETS (Settings → Secrets and variables → Actions)
#   SUPABASE_URL                 e.g. https://xxxx.supabase.co
#   BRAVE_SEARCH_API_KEY        web search; never exposed to the browser
#   SUPABASE_SERVICE_ROLE_KEY    the service-role key — this is the ONLY place
#                                it is used. It is never in frontend code and
#                                never in the repository. check-bundle-secrets
#                                fails the web build if it ever leaks in.
#
# The service-role key bypasses RLS (that is how the scraper writes reference
# data a student cannot). It does NOT bypass privilege checks, so migration 0012
# grants EXECUTE on the scraper functions back to service_role explicitly.

name: scholarship-scraper
run-name: >-
  scholarship scraper (${{ github.event_name == 'schedule' && 'weekly' || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery, selected monitoring, or both'
        type: choice
        options: [discovery, monitoring, combined]
        default: 'combined'
        required: true
      request_id:
        description: 'Optional UUID correlating an admin refresh request'
        required: false
        default: ''
      triggered_by:
        description: 'schedule | manual'
        required: false
        default: 'manual'
      triggered_by_user:
        description: 'admin profile id (recorded in crawl_logs)'
        required: false
        default: ''

# One run at a time. The database advisory lock in begin_crawl_run() is the
# real guarantee; this just avoids starting a runner that would immediately exit.
concurrency:
  group: scholarship-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # A parser only runs against production data if its own tests pass. A
      # provider changing their page shape shows up here as a test failure
      # rather than as silently wrong scholarship records.
      - name: Test the scraper
        run: python -m pytest scraper/tests -q

      - name: Run the scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          CRAWL_MODE: ${{ github.event_name == 'schedule' && 'combined' || inputs.mode }}
          REQUEST_ID: ${{ inputs.request_id }}
          # 'schedule' on a cron run; the dispatch input otherwise.
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || inputs.triggered_by }}
          TRIGGERED_BY_USER: ${{ inputs.triggered_by_user }}
        run: |
          ARGS=(--triggered-by "${TRIGGERED_BY:-schedule}" --mode "${CRAWL_MODE:-combined}")
          if [ -n "${REQUEST_ID}" ]; then
            ARGS+=(--request-id "${REQUEST_ID}")
          fi
          if [ -n "${TRIGGERED_BY_USER}" ]; then
            ARGS+=(--triggered-by-user "${TRIGGERED_BY_USER}")
          fi
          python -m scraper.main "${ARGS[@]}"
